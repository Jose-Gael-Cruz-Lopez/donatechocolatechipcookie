<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#ffffff" />
    <title>Community desk — Chocolate Chip Cookie</title>
    <link rel="icon" href="/cookie.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/admin/login.js" defer></script>
  </head>
  <body class="login-page">
    <div class="login-shell">
      <header class="admin-header">
        <a class="wordmark" href="/"
          >Chocolate Chip Cookie<span>community desk</span></a
        >
        <a class="text-link" href="/">Back to the invitation ↗</a>
      </header>
      <main class="login-main">
        <div class="login-panel">
          <p class="eyebrow">a little space for you</p>
          <h1>Welcome back.</h1>
          <p class="page-description">
            Sign in to see who’s joining the community.
          </p>
          <noscript>
            <p class="notice">
              Enable JavaScript to sign in to the community desk.
            </p>
          </noscript>
          <form id="login-form" action="/api/admin/login" method="post">
            <div class="password-field">
              <label for="password">Admin password</label>
              <div class="password-input">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  maxlength="256"
                  required
                  aria-describedby="password-hint"
                />
                <button
                  class="text-button"
                  id="show-password"
                  type="button"
                  aria-label="Show admin password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
              <p class="field-hint" id="password-hint">
                Use your private admin password.
              </p>
            </div>
            <p
              class="notice error-notice"
              id="login-error"
              role="alert"
              hidden
            ></p>
            <button
              class="button button-dark login-submit"
              id="login-submit"
              type="submit"
            >
              <span id="login-label">Open the guest list</span
              ><span aria-hidden="true">↗</span>
            </button>
            <p
              class="login-status"
              id="login-status"
              role="status"
              aria-live="polite"
            ></p>
          </form>
          <p class="login-note">Your private community desk.</p>
        </div>
      </main>
      <footer class="admin-footer">
        <p>Good things start with a hello.</p>
        <a
          class="j-signature"
          href="https://risingfounder.net/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="An initiative by J — opens in a new tab"
        >
          <span>an initiative by</span
          ><img src="/j-black.svg" alt="J" width="20" height="30" />
        </a>
      </footer>
    </div>
  </body>
</html>
